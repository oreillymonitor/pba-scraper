name: Update PBA TV Schedule

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the updated JSON file

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scrapers
      run: |
        python scrape_pba.py
        python scrape_pwba.py
        python scrape_usbc.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pba_tv_schedule.json pwba_tv_schedule.json usbc_tv_schedule.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated update of PBA, PWBA, and USBC TV schedules"
          git push
        fi
