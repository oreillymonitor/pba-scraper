<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Bowling Schedule | Unified TV Listings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260519-2347">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎳</text></svg>">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <div class="container">
            <div class="brand">
                <span class="logo-emoji">🎳</span>
                <div class="brand-text">
                    <h1>Bowling Schedule</h1>
                    <p>Unified TV & Streaming Listings</p>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="control-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="pastEventsToggle">
                        <span class="slider"></span>
                        <span class="label-text">Show Past</span>
                    </label>
                </div>
                
                <button id="themeToggle" class="theme-toggle" title="Toggle Light/Dark Mode">
                    <span class="icon-sun">☀️</span>
                    <span class="icon-moon">🌙</span>
                </button>
            </div>

            <div class="filters-container">
                <div class="filters" id="tourFilters">
                    <button class="filter-btn active" data-filter="all">All Events</button>
                    <button class="filter-btn" data-filter="pba">PBA</button>
                    <button class="filter-btn" data-filter="pwba">PWBA</button>
                    <button class="filter-btn" data-filter="usbc">USBC / College</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Syncing latest schedules...</p>
        </div>
        
        <div id="scheduleGrid" class="schedule-grid hidden">
            <!-- Cards will be injected here -->
        </div>
        
        <div id="emptyState" class="empty-state hidden">
            <p>No upcoming events found for this filter.</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Data automatically updated daily from official PBA, PWBA, and USBC sources.</p>
            <p class="copyright">&copy; 2026 Bowling Monitor</p>
        </div>
    </footer>

    <script src="app.js?v=20260519-2347"></script>
</body>
</html>
